<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Openp41ge — Git Repository Demo</title>
    <link rel="stylesheet" href="./src/demo-styles.css" />
  </head>
  <body>
    <div class="demo-root">
      <!-- Main panel area -->
      <div class="demo-main">
        <!-- Repo header -->
        <div class="repo-header">
          <span class="repo-icon">&#x2387;</span>
          <span>openp41ge</span>
          <span style="color: #555; font-weight: 400">— Git Repository</span>
        </div>

        <!-- Git panel -->
        <div class="demo-git-panel" id="git-panel"></div>

        <!-- Console output -->
        <div class="demo-console">
          <div class="demo-console-header">
            <span>Console Log</span>
            <span style="margin-left: auto; color: #555; font-weight: 400; font-size: 10px">
              (callback activity)
            </span>
          </div>
          <div class="demo-console-body" id="console-body">
            <div class="log-entry">
              <span class="timestamp">[--:--:--]</span>Waiting for demo to initialize...
            </div>
          </div>
        </div>
      </div>

      <!-- Sidebar controls -->
      <div class="demo-sidebar">
        <h3>State Controls</h3>

        <div class="demo-control-group">
          <button class="demo-btn demo-btn--warning" id="btn-load-branches">
            &#x21bb; Loading branches
          </button>
          <button class="demo-btn demo-btn--warning" id="btn-load-commits">
            &#x21bb; Loading commits
          </button>
          <button class="demo-btn demo-btn--warning" id="btn-load-files">
            &#x21bb; Loading files
          </button>
        </div>

        <div class="demo-control-group">
          <button class="demo-btn demo-btn--danger" id="btn-show-error">
            &#x26A0; Show error state
          </button>
        </div>

        <div class="demo-control-group">
          <button class="demo-btn demo-btn--danger" id="btn-clear-branches">
            &#x2716; Clear branches
          </button>
          <button class="demo-btn demo-btn--danger" id="btn-clear-commits">
            &#x2716; Clear commits
          </button>
          <button class="demo-btn demo-btn--danger" id="btn-clear-files">
            &#x2716; Clear files
          </button>
        </div>

        <hr style="border: none; border-top: 1px solid #2a2a2a; margin: 4px 0" />

        <div class="demo-control-group">
          <button class="demo-btn demo-btn--success" id="btn-reset">&#x21A9; Reset all</button>
        </div>

        <div style="margin-top: auto; padding-top: 12px; font-size: 10px; color: #444">
          Git Repository Demo v0.1
        </div>
      </div>
    </div>

    <script type="module" src="./src/demo-app.ts"></script>
  </body>
</html>
